# RECAP (pi*0.6) improvement round k >= 1: SFT from the pretrained policy on the accumulated dataset
# (initial demonstrations + rollouts of every round so far), each frame conditioned on its own advantage
# label. Identical to pi05_base_bi_flexiv_cylinder_stack_recap_h100 except for the dataset.
#
# The dataset must carry the column `advantage_positive`, written by
# scripts/recap/write_advantage_labels.py from an approved labeling attempt. Which labels a run trains on
# is decided by the dataset alone; the first lines of the training log print the share of positive frames
# read from it. Without the column every frame is trained as positive (the round-0 behaviour).
#
# `repo_id` below is a placeholder for the labeled copy of the round. Point OPENPI_LEROBOT_DATASET_ROOT at
# its directory, and compute its norm stats first (scripts/compute_norm_stats.py).
# Do not set XLA_FLAGS; see docs/training-optimization.md.
#   env -u LD_LIBRARY_PATH XLA_PYTHON_CLIENT_MEM_FRACTION=0.9 OPENPI_LEROBOT_DATASET_ROOT=<labeled dataset dir> \
#   python scripts/train.py pi05_base_bi_flexiv_cylinder_stack_recap_round_h100 --exp-name=<experiment-name>
lr_schedule:
  type: CosineDecaySchedule
  warmup_steps: 1000
  peak_lr: 2.5e-5
  decay_steps: 30000
  decay_lr: 2.5e-6
model:
  type: Pi0Config
  # Scanned 2026-11-14 over the 226,975 frames of the initial demonstrations: the longest tokenized
  # "Task: ..., State: ...;\nAdvantage: negative;\nAction: " prompt is 116 tokens (111 without the
  # advantage text), so 128 leaves 12 spare. Truncation would cut the advantage text first. Rollout
  # frames have not been scanned; re-scan on the accumulated dataset.
  max_token_len: 128
  pi05: true
  discrete_state_input: true
  advantage_conditioned: true
  advantage_dropout: 0.3
  enable_training_time_rtc: false
  # Encode all three visual views in one SigLIP call.
  batch_image_views: true
weight_loader:
  type: CheckpointWeightLoader
  params_path: gs://openpi-assets/checkpoints/pi05_base/params
ema_decay: null
data:
  type: LeRobotBiFlexivDataConfig
  repo_id: Xense/cylinder-stack-0909-recap-round1
  base_config:
    prompt_from_task: true
    tactile: false
  default_prompt: Pick up and stack the cylinders on the red base in this order:pink,purple,orange,green
batch_size: 256
num_workers: 64
num_train_steps: 60000
# Whole-model grad/parameter norms are computed only on these logging steps.
log_interval: 100
save_interval: 10000
keep_period: 10000
fsdp_devices: 8
strict_batch_order: false
project_name: openpi
