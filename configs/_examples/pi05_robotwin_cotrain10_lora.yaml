# EXPO-FT simulation base: pi0.5 LoRA SFT co-trained on 10 RoboTwin 2.0 tasks (Aloha-AgileX, Easy / demo_clean),
# 50 official demonstrations each; every task's RL starts from the same checkpoint.
#
# Recipe as pi05_robotwin_beat_block_hammer_lora (frozen Gemma backbones with LoRA, AdamW at a constant 2.5e-5,
# no EMA, batch 64, H=16); only the dataset and the length change. 30k steps give each task about 25-30 passes over
# its data, against ~170 for the single-task 15k base, since the RL start should stay at 30-70% success.
# A checkpoint every 3,000 steps, all kept, for picking the base.
#
# Data come from expo-ft's scripts/convert_robotwin_to_lerobot.py with all ten task directories; each episode's
# prompt is its own task's instruction. Transforms and the `actions` column are those of the single-task config.
model:
  type: Pi0Config
  pi05: true
  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora
  action_horizon: 16
weight_loader:
  type: CheckpointWeightLoader
  params_path: gs://openpi-assets/checkpoints/pi05_base/params
ema_decay: null
data:
  type: LeRobotAlohaDataConfig
  repo_id: robotwin/cotrain10_aloha_clean_50
  adapt_to_pi: false
  use_delta_joint_actions: true
  action_sequence_keys: [actions]
  repack_transforms:
    inputs:
    - type: RepackTransform
      structure:
        images:
          cam_high: observation.images.cam_high
          cam_left_wrist: observation.images.cam_left_wrist
          cam_right_wrist: observation.images.cam_right_wrist
        state: observation.state
        actions: actions
        prompt: prompt
  base_config:
    prompt_from_task: true
lr_schedule:
  type: CosineDecaySchedule
  warmup_steps: 0
  peak_lr: 2.5e-5
  decay_steps: 30000
  decay_lr: 2.5e-5
optimizer:
  type: AdamW
  b1: 0.9
  b2: 0.95
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0
batch_size: 64
num_workers: 8
num_train_steps: 30000
save_interval: 3000
keep_period: 3000
