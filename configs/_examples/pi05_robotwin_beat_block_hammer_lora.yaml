# EXPO-FT simulation base: pi0.5 LoRA SFT on RoboTwin 2.0 beat_block_hammer (Aloha-AgileX, Easy / demo_clean).
#
# Recipe follows docs/xense-openpi/expo-ft-spec.md 3.1 in the workspace: frozen Gemma backbones with LoRA,
# AdamW (b2 0.95, weight decay 1e-10, clip 1.0) at a constant 2.5e-5, no EMA, batch 64, ~4,000 steps,
# a checkpoint every 500 steps. H=16 matches the spec's reference configuration.
#
# Data come from expo-ft's scripts/convert_robotwin_to_lerobot.py (set HF_LEROBOT_HOME to its output).
# The transforms match RoboTwin's official pi0.5 baseline (XPolicyLab Pi_05): Aloha inputs without the
# pi runtime adaptation, delta joints with absolute grippers. The action column is `actions`, the key
# expo-ft's replay buffer inserts, so this config also repacks the RL learner's replay transitions.
model:
  type: Pi0Config
  pi05: true
  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora
  action_horizon: 16
weight_loader:
  type: CheckpointWeightLoader
  params_path: gs://openpi-assets/checkpoints/pi05_base/params
ema_decay: null
data:
  type: LeRobotAlohaDataConfig
  repo_id: robotwin/beat_block_hammer_aloha_clean_50
  adapt_to_pi: false
  use_delta_joint_actions: true
  action_sequence_keys: [actions]
  repack_transforms:
    inputs:
    - type: RepackTransform
      structure:
        images:
          cam_high: observation.images.cam_high
          cam_left_wrist: observation.images.cam_left_wrist
          cam_right_wrist: observation.images.cam_right_wrist
        state: observation.state
        actions: actions
        prompt: prompt
  base_config:
    prompt_from_task: true
  default_prompt: Pick up the hammer and beat the block.
lr_schedule:
  type: CosineDecaySchedule
  warmup_steps: 0
  peak_lr: 2.5e-5
  decay_steps: 4000
  decay_lr: 2.5e-5
optimizer:
  type: AdamW
  b1: 0.9
  b2: 0.95
  weight_decay: 1.0e-10
  clip_gradient_norm: 1.0
batch_size: 64
num_workers: 8
num_train_steps: 4000
save_interval: 500
keep_period: 500
